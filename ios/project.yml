name: Vyveska
options:
  bundleIdPrefix: app.vyveska
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.vyveska.studio
    PRODUCT_NAME: Vyveska
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    INFOPLIST_FILE: Vyveska/Info.plist
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: false
targets:
  Vyveska:
    type: application
    platform: iOS
    sources:
      - path: Vyveska
        excludes:
          - "www/**"
          - Info.plist
      - path: Vyveska/www
        type: folder
        buildPhase: resources
    settings:
      INFOPLIST_FILE: Vyveska/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: app.vyveska.studio
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
