<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SignStudio — дизайн вывесок</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #29292e;background:#111114}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd84d,#ff8a00);color:#111;font-size:22px}.btn{border:1px solid #33333a;background:#1a1a1f;color:#eee;border-radius:10px;padding:9px 12px}.primary{background:#ffd84d;color:#111;border-color:#ffd84d;font-weight:800}.app{display:grid;grid-template-columns:86px 1fr 300px;min-height:calc(100vh - 64px)}.tools,.panel{background:#111114;padding:14px 10px}.tools{border-right:1px solid #29292e}.panel{border-left:1px solid #29292e}.tool{width:100%;border:0;background:transparent;color:#aaa;border-radius:10px;padding:10px 4px;margin:4px 0}.tool:hover{background:#202025;color:#fff}.tool input{display:none}.stage{padding:12px;display:flex;flex-direction:column;min-width:0}.bar{height:38px;color:#888;font-size:12px;display:flex;gap:16px;align-items:center}.canvasWrap{flex:1;display:grid;place-items:center}.canvas{position:relative;width:min(100%,1080px);aspect-ratio:1.6;background:#555 center/cover no-repeat;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px #0008;touch-action:none}.demo{position:absolute;inset:0;background:linear-gradient(#777 0 63%,#1c1c1f 63%)}.signboard{position:absolute;left:8%;right:8%;top:28%;height:38%;background:#181818;box-shadow:0 10px 30px #0008}.text{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;cursor:grab;user-select:none;line-height:.95}.text.selected{outline:1px dashed #ffd84d;outline-offset:8px}.section{font-size:10px;color:#72727a;text-transform:uppercase;letter-spacing:.12em;margin:3px 4px 12px}.field{display:block;margin:0 0 14px}.field span{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-bottom:7px}.field input[type=text],.field select{width:100%;background:#1a1a1f;border:1px solid #34343a;color:#fff;border-radius:9px;padding:10px}.field input[type=range]{width:100%;accent-color:#ffd84d}.row{display:flex;align-items:center;justify-content:space-between;color:#bbb;font-size:12px;padding:7px 0}.row input{accent-color:#ffd84d}.color{display:flex;gap:9px;align-items:center;background:#1a1a1f;border:1px solid #34343a;border-radius:9px;padding:6px}.color input{width:40px;height:30px;border:0;background:transparent}.full{width:100%;margin-top:8px}.layers{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.layer{padding:9px;border:1px solid #303036;border-radius:9px;background:#18181c;color:#bbb;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer.sel{border-color:#ffd84d;color:#fff}.mobile{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.tools{display:none}.panel{border:0;border-top:1px solid #29292e;padding-bottom:90px}.stage{padding:7px}.canvas{aspect-ratio:1.3}.mobile{position:fixed;display:flex;left:12px;right:12px;bottom:10px;height:60px;background:#18181eee;border:1px solid #38383f;border-radius:18px;z-index:30}.mobile button,.mobile label{flex:1;border:0;background:transparent;color:#ddd;display:grid;place-items:center;font-size:12px}.mobile input{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">S</div><div>SignStudio<br><small style="color:#888;font-weight:500">Дизайн вывесок</small></div></div><button class="btn primary" id="export">PNG</button></header>
<main class="app">
<aside class="tools"><div class="section">Инструменты</div><button class="tool" id="add">＋ Текст</button><label class="tool">▧ Фото фасада<input class="file" type="file" accept="image/*"></label><button class="tool" id="reset">↻ Сброс</button></aside>
<section class="stage"><div class="bar"><label><input id="snap" type="checkbox"> Привязка</label><span>Перетаскивай надпись пальцем</span></div><div class="canvasWrap"><div id="canvas" class="canvas"><div id="demo" class="demo"></div><div id="board" class="signboard"></div></div></div></section>
<aside class="panel"><div class="section">Слои</div><div id="layers" class="layers"></div><button class="btn full" id="add2">＋ Добавить надпись</button><div class="section" style="margin-top:20px">Свойства</div>
<label class="field"><span>Текст</span><input id="text" type="text"></label>
<label class="field"><span>Размер <b id="sizev"></b></span><input id="size" type="range" min="16" max="120"></label>
<label class="field"><span>Толщина</span><select id="weight"><option value="400">Regular</option><option value="700">Bold</option><option value="800">Extra Bold</option><option value="900">Black</option></select></label>
<label class="field"><span>Цвет</span><div class="color"><input id="color" type="color"><code id="colorv"></code></div></label>
<label class="field"><span>Объём <b id="depthv"></b></span><input id="depth" type="range" min="0" max="24"></label>
<div class="row"><span>Тень</span><input id="shadow" type="checkbox"></div><div class="row"><span>Подсветка</span><input id="glow" type="checkbox"></div>
<div class="section" style="margin-top:20px">Панель</div><div class="row"><span>Алюкобонд</span><input id="boardOn" type="checkbox" checked></div><label class="field"><span>Цвет панели</span><div class="color"><input id="boardColor" type="color" value="#181818"><code id="boardColorv">#181818</code></div></label>
</aside>
</main>
<nav class="mobile"><button id="madd">＋ Текст</button><label>▧ Фасад<input class="file" type="file" accept="image/*"></label><button id="mexport">PNG</button></nav>
<script>
var initial=[{id:1,text:"COLORIZE",x:50,y:42,size:72,color:"#ffffff",weight:900,depth:10,shadow:true,glow:true},{id:2,text:"НАРУЖНАЯ РЕКЛАМА",x:50,y:58,size:28,color:"#f6c945",weight:700,depth:4,shadow:false,glow:false}];
var state={layers:JSON.parse(JSON.stringify(initial)),selected:1,bg:"",board:true,boardColor:"#181818",snap:false};
var canvas=document.getElementById("canvas"),board=document.getElementById("board"),demo=document.getElementById("demo");
function q(id){return document.getElementById(id)} function current(){return state.layers.find(function(x){return x.id===state.selected})}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){canvas.querySelectorAll(".text").forEach(function(n){n.remove()});state.layers.forEach(function(l){var d=document.createElement("div");d.className="text"+(l.id===state.selected?" selected":"");d.textContent=l.text;d.dataset.id=l.id;d.style.left=l.x+"%";d.style.top=l.y+"%";d.style.fontSize=l.size+"px";d.style.fontWeight=l.weight;d.style.color=l.color;d.style.textShadow=l.depth+"px "+Math.max(2,l.depth*.6)+"px 0 #0008"+(l.shadow?",0 8px 22px #000a":"")+(l.glow?",0 0 10px "+l.color+",0 0 28px "+l.color:"");canvas.appendChild(d);drag(d,l)});board.style.display=state.board?"block":"none";board.style.background=state.boardColor;canvas.style.backgroundImage=state.bg?"url("+state.bg+")":"";demo.style.display=state.bg?"none":"block";q("layers").innerHTML=state.layers.map(function(l){return '<div class="layer '+(l.id===state.selected?"sel":"")+'" data-id="'+l.id+'">'+esc(l.text)+"</div>"}).join("");document.querySelectorAll(".layer").forEach(function(n){n.onclick=function(){state.selected=+n.dataset.id;render()}});sync()}
function sync(){var l=current();if(!l)return;q("text").value=l.text;q("size").value=l.size;q("sizev").textContent=l.size+"px";q("weight").value=l.weight;q("color").value=l.color;q("colorv").textContent=l.color;q("depth").value=l.depth;q("depthv").textContent=l.depth+"px";q("shadow").checked=l.shadow;q("glow").checked=l.glow;q("boardOn").checked=state.board;q("boardColor").value=state.boardColor;q("boardColorv").textContent=state.boardColor}
function update(k,v){var l=current();if(!l)return;l[k]=v;render()} function add(){var id=Date.now();state.layers.push({id:id,text:"НОВАЯ НАДПИСЬ",x:50,y:50,size:42,color:"#ffffff",weight:800,depth:6,shadow:true,glow:false});state.selected=id;render()}
function drag(el,l){el.onpointerdown=function(e){e.preventDefault();state.selected=l.id;var rect=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=l.x,oy=l.y;function move(ev){var x=ox+(ev.clientX-sx)/rect.width*100,y=oy+(ev.clientY-sy)/rect.height*100;if(state.snap){x=Math.round(x/2)*2;y=Math.round(y/2)*2}l.x=Math.max(0,Math.min(100,x));l.y=Math.max(0,Math.min(100,y));el.style.left=l.x+"%";el.style.top=l.y+"%"}function up(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);render()}window.addEventListener("pointermove",move);window.addEventListener("pointerup",up)}}
q("text").oninput=function(e){update("text",e.target.value)};q("size").oninput=function(e){update("size",+e.target.value)};q("weight").onchange=function(e){update("weight",+e.target.value)};q("color").oninput=function(e){update("color",e.target.value)};q("depth").oninput=function(e){update("depth",+e.target.value)};q("shadow").onchange=function(e){update("shadow",e.target.checked)};q("glow").onchange=function(e){update("glow",e.target.checked)};q("boardOn").onchange=function(e){state.board=e.target.checked;render()};q("boardColor").oninput=function(e){state.boardColor=e.target.value;render()};q("snap").onchange=function(e){state.snap=e.target.checked};q("add").onclick=add;q("add2").onclick=add;q("madd").onclick=add;q("reset").onclick=function(){state={layers:JSON.parse(JSON.stringify(initial)),selected:1,bg:"",board:true,boardColor:"#181818",snap:false};render()};
document.querySelectorAll(".file").forEach(function(inp){inp.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;state.bg=URL.createObjectURL(f);render()}});
async function exp(){var w=1200,h=750,c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=w;c.height=h;if(state.bg){var img=new Image();img.src=state.bg;await new Promise(function(r){img.onload=r;img.onerror=r});ctx.drawImage(img,0,0,w,h)}else{ctx.fillStyle="#777";ctx.fillRect(0,0,w,h)}if(state.board){ctx.fillStyle=state.boardColor;ctx.fillRect(w*.08,h*.28,w*.84,h*.38)}state.layers.forEach(function(l){ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=l.weight+" "+Math.round(l.size*1.38)+"px Arial";var x=w*l.x/100,y=h*l.y/100;ctx.fillStyle="#0008";ctx.fillText(l.text,x+l.depth*1.5,y+l.depth);if(l.glow){ctx.shadowColor=l.color;ctx.shadowBlur=24}else if(l.shadow){ctx.shadowColor="#000";ctx.shadowBlur=18}ctx.fillStyle=l.color;ctx.fillText(l.text,x,y);ctx.shadowBlur=0});var a=document.createElement("a");a.download="sign-design.png";a.href=c.toDataURL("image/png");a.click()}q("export").onclick=exp;q("mexport").onclick=exp;render();
</script></body></html>
